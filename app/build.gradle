plugins {
    id 'com.android.application'
}

android {
    namespace 'com.colourtradinghack.bdg.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.colourtradinghack.bdg.app'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '2.200.2'
    }

    signingConfigs {
        release {
            storeFile file('release.jks')
            storePassword System.getenv('KS_PASS') ?: 'android'
            keyAlias System.getenv('KEY_ALIAS') ?: 'key'
            keyPassword System.getenv('KEY_PASS') ?: 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (file('release.jks').exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
}
